{% extends "base.html" %}
{% block title %}批量导入学生{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>批量导入学生</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="file">选择Excel文件</label>
                            <input type="file" class="form-control-file" id="file" name="file" accept=".xlsx">
                            <small class="form-text text-muted">文件格式：学号、姓名、性别、出生日期、身份证号、手机号、地址、班级</small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">导入</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
